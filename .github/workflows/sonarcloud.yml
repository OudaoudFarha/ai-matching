name: SonarCloud (fin prove)
on:
  push:
    branches: [ "fin" ]
  pull_request:
    branches: [ "fin" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Backend (resume-service)
        working-directory: backend/resume-service
        run: mvn -B -DskipTests clean package
        
      - name: Test Backend + JaCoCo XML
        working-directory: backend/resume-service
        run: mvn -B clean test


      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend deps
        working-directory: frontend/resume-ui
        run: npm ci
        
      - name: Test Frontend + coverage
        working-directory: frontend/resume-ui
        run: npm run test:coverage


      # option: ne bloque pas le workflow si ton TS build casse
      - name: Build Frontend (optional)
        working-directory: frontend/resume-ui
        run: npm run build
        continue-on-error: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FastAPI deps (optional)
        working-directory: ai-matching-fast-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        continue-on-error: true
      - name: Install FastAPI deps
        working-directory: ai-matching-fast-api
        run: |
           python -m pip install --upgrade pip
           pip install -r requirements.txt

      - name: Test FastAPI + coverage.xml
        working-directory: ai-matching-fast-api
        run: python -m pytest --cov=. --cov-report=xml


      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=oudaoudfarha
            -Dsonar.projectKey=OudaoudFarha_ai-matching
            -Dsonar.sources=backend/resume-service/src,ai-matching-fast-api,frontend/resume-ui/src
            -Dsonar.exclusions=**/node_modules/**,**/target/**,**/.venv/**,**/__pycache__/**,**/dist/**,**/build/**
            -Dsonar.java.binaries=backend/resume-service/target/classes
