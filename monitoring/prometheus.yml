global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "ai-matching-fastapi"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: "resume-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8080"]
